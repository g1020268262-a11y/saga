\* Report a settled mismatch only after at least one ordinary reply.
\* This filters the query, not the failure timing in Next.
SPECIFICATION Spec
CONSTANTS
    InitialQuota = 50
    Connections = {c1}
    MaxRequests = 2
    MetadataValid = TRUE
    FaultModes = {"RequestAbort"}
    MaxFaults = 1
INVARIANTS TypeOK SourceAccounting ReceiverQuotaSafety QuiescentAgreementAfterProgress
